[project]
name = "image-to-video-project"
version = "0.1.0"
description = "フォルダごとの写真を 4K のスライドショー動画にする GUI アプリ"
authors = [
    { name = "SamuraiHumanGo_Mac", email = "gotechsamurai@samurai-human-go.com" }
]
dependencies = [
    "pillow>=12.1.1",
    "pillow-heif>=1.4.0",
    "pyside6>=6.10.2",
]
readme = "README.md"
requires-python = ">= 3.12"

[tool.uv]
# パッケージとして配らず、src/main.py をスクリプトとして実行する
package = false
