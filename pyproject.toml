[project]
name = "image-to-video-project"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "SamuraiHumanGo_Mac", email = "gotechsamurai@samurai-human-go.com" }
]
dependencies = [
    "pillow>=12.1.1",
    "pillow-heif>=1.4.0",
    "pyside6>=6.10.2",
]
readme = "README.md"
requires-python = ">= 3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/image_to_video_project"]
